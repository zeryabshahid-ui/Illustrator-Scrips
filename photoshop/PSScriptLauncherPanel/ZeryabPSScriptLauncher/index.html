<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PS Script Launcher</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toolbar">
    <input id="search" type="text" placeholder="Search scripts..." autocomplete="off">
    <button id="refresh" title="Refresh list">&#x21bb;</button>
  </div>
  <div id="actions">
    <button id="openFolder" title="Open the scripts folder in Explorer">Open Folder</button>
    <button id="changeFolder" title="Choose a different scripts folder">Change folder</button>
  </div>
  <div id="path" title=""></div>
  <ul id="list"></ul>
  <div id="status"></div>
  <script src="js/CSInterface.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
